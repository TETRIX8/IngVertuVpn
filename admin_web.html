<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#05080f">
<title>IngVertuVpn · Админ-панель</title>
<style>
:root{--bg:#05080f;--bg2:#0a1020;--card:#0d1428;--card2:#111a33;--tx:#eef2ff;--tx2:#c9d3f2;--mut:#8b99c2;--mut2:#5f6d96;
--line:rgba(140,165,255,.13);--line2:rgba(140,165,255,.24);--a1:#3b82ff;--a2:#22d3ee;--a3:#8b5cf6;--ok:#34d399;--okb:rgba(52,211,153,.12);
--bad:#fb7185;--badb:rgba(251,113,133,.12);--wt:#fcd34d;--wb:rgba(251,191,36,.12);--grad:linear-gradient(135deg,#3b82ff,#22d3ee);
--r:18px;--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif}
body{min-height:100vh;background:radial-gradient(1200px 600px at 10% -10%,rgba(59,130,255,.16),transparent 60%),radial-gradient(900px 500px at 110% 0,rgba(139,92,246,.12),transparent 60%),var(--bg);}
a{color:var(--a2);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
.side{width:236px;flex:none;position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:rgba(8,12,24,.7);backdrop-filter:blur(12px);display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.3px;font-size:18px;padding:4px 10px 18px}
.logo i{width:30px;height:30px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-style:normal;font-size:16px;box-shadow:0 6px 20px rgba(59,130,255,.35)}
.logo small{display:block;font-size:11px;color:var(--mut);font-weight:500;letter-spacing:0}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;color:var(--tx2);font-weight:550}
.nav a:hover{background:rgba(140,165,255,.07)}
.nav a.on{background:linear-gradient(135deg,rgba(59,130,255,.22),rgba(34,211,238,.12));color:#fff;box-shadow:inset 0 0 0 1px var(--line2)}
.nav .ic{width:20px;text-align:center}
.side .foot{margin-top:auto;font-size:12px;color:var(--mut);padding:10px}
main{flex:1;min-width:0;padding:22px 26px 40px;max-width:1280px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top h1{font-size:24px;margin:0;font-weight:800;letter-spacing:-.3px;flex:1;min-width:150px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:9px;color:var(--mut);cursor:pointer;font-weight:600;font-size:13px}
.seg button.on{background:var(--card2);color:#fff;box-shadow:inset 0 0 0 1px var(--line2)}
.grid{display:grid;gap:14px}
.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.k2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:linear-gradient(180deg,rgba(17,26,51,.9),rgba(13,20,40,.9));border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.card h3{margin:0 0 12px;font-size:14px;color:var(--tx2);font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.kpi .l{font-size:12.5px;color:var(--mut);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-top:4px;white-space:nowrap}
.kpi .s{font-size:12px;color:var(--mut);margin-top:2px}
.kpi.hl{background:linear-gradient(135deg,rgba(59,130,255,.25),rgba(34,211,238,.10));border-color:var(--line2)}
.up{color:var(--ok)}.dn{color:var(--bad)}
.mt{margin-top:14px}
.chart{width:100%;height:170px;display:block}
.chart .b{fill:url(#g1)}.chart .b2{fill:url(#g2)}
.chart text{fill:var(--mut2);font-size:10px}
.tip{font-size:12px;color:var(--mut);min-height:18px;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{color:var(--mut);font-weight:600;text-align:left;font-size:12px;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.cl{cursor:pointer}tr.cl:hover td{background:rgba(140,165,255,.05)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -6px}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700;background:rgba(140,165,255,.12);color:var(--tx2);white-space:nowrap}
.pill.ok{background:var(--okb);color:var(--ok)}.pill.bad{background:var(--badb);color:var(--bad)}.pill.w{background:var(--wb);color:var(--wt)}.pill.v{background:rgba(139,92,246,.16);color:#c4b5fd}
.mut{color:var(--mut)}.sm{font-size:12.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:10px 15px;font-weight:700;cursor:pointer;background:var(--card2);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line2);white-space:nowrap}
.btn:hover{filter:brightness(1.15)}
.btn.p{background:var(--grad);color:#04101f;box-shadow:0 6px 20px rgba(34,211,238,.25)}
.btn.d{background:var(--badb);color:var(--bad);box-shadow:inset 0 0 0 1px rgba(251,113,133,.3)}
.btn.s{padding:7px 11px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{width:100%;background:#070c19;border:1px solid var(--line2);border-radius:12px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--a1);box-shadow:0 0 0 3px rgba(59,130,255,.18)}
textarea{min-height:150px;resize:vertical;font-family:inherit}
label.f{display:block;font-size:12.5px;color:var(--mut);font-weight:600;margin:12px 0 6px}
.sw{position:relative;width:46px;height:27px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;border-radius:99px;background:#1b2544;transition:.2s;cursor:pointer;box-shadow:inset 0 0 0 1px var(--line2)}
.sw span:after{content:"";position:absolute;width:21px;height:21px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+span{background:var(--a1)}.sw input:checked+span:after{transform:translateX(19px)}
.set{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set .t{flex:1;min-width:0}
.set .c{width:280px;max-width:52%}
.fun{display:flex;flex-direction:column;gap:8px}
.fs{position:relative;border-radius:12px;background:#0a1124;overflow:hidden;border:1px solid var(--line)}
.fs .bar{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,rgba(59,130,255,.45),rgba(34,211,238,.25))}
.fs .in{position:relative;display:flex;gap:10px;padding:11px 14px;align-items:center}
.fs .in b{font-size:17px;min-width:56px}
.fs .in .t{flex:1}
.fs .in .p{font-weight:700;color:var(--tx2);font-size:13px}
.empty{padding:28px;text-align:center;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--sb));transform:translateX(-50%) translateY(20px);background:#111a33;border:1px solid var(--line2);padding:11px 16px;border-radius:14px;opacity:0;transition:.25s;z-index:99;max-width:92vw;box-shadow:0 10px 40px rgba(0,0,0,.5);pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.err{border-color:rgba(251,113,133,.5);color:#fecdd3}
.ld{display:inline-block;width:18px;height:18px;border:2px solid var(--line2);border-top-color:var(--a2);border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.bnav{display:none}
.prog{height:8px;border-radius:9px;background:#0a1124;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.prog i{display:block;height:100%;background:var(--grad)}
.uhead{display:flex;gap:14px;align-items:center}
.av{width:52px;height:52px;border-radius:16px;background:var(--grad);display:grid;place-items:center;font-weight:800;font-size:20px;color:#04101f;flex:none}
.kv{display:grid;grid-template-columns:150px 1fr;gap:7px 12px;font-size:14px}
.kv div:nth-child(odd){color:var(--mut)}
.preview{background:#17212b;border-radius:14px;padding:10px 12px;max-width:420px;white-space:pre-wrap;word-break:break-word;font-size:14px;border:1px solid #233;}
.preview img{max-width:100%;border-radius:10px;display:block;margin:-2px -4px 8px;width:calc(100% + 8px)}
.preview .pb{margin-top:8px;text-align:center;background:#2b5278;border-radius:8px;padding:7px;font-weight:600;font-size:13px}
.login{max-width:420px;margin:12vh auto;padding:20px;text-align:center}
.login .logo{justify-content:center;font-size:24px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet .box{background:#0c1327;border-top:1px solid var(--line2);border-radius:22px 22px 0 0;width:100%;padding:12px 12px calc(16px + var(--sb))}
.sheet .box a{display:flex;gap:12px;padding:14px;border-radius:12px;color:var(--tx);font-weight:600}
.sheet .box a:active{background:var(--card2)}
.handle{width:40px;height:5px;border-radius:9px;background:var(--line2);margin:2px auto 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:transparent;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--tx2);cursor:pointer}
.chip.on{background:var(--a1);border-color:var(--a1);color:#fff}
.note{font-size:12.5px;color:var(--mut);background:rgba(59,130,255,.07);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
.warn{background:var(--wb);border-color:rgba(251,191,36,.3);color:#fde68a}
@media (max-width:1100px){.k4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
 .side{display:none}
 main{padding:14px 12px calc(96px + var(--sb))}
 .top h1{font-size:21px}
 .k3,.k2{grid-template-columns:1fr}
 .kpi .v{font-size:22px}
 .card{padding:14px}
 .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(8,12,24,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--sb))}
 .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--mut);padding:5px 0;font-weight:600}
 .bnav a .ic{font-size:20px;line-height:1.1}
 .bnav a.on{color:#fff}
 .set{flex-wrap:wrap}.set .c{width:100%;max-width:100%}
 .kv{grid-template-columns:120px 1fr}
 .hm{display:none}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#3b82ff" stop-opacity=".55"/></linearGradient>
<linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#8b5cf6" stop-opacity=".5"/></linearGradient>
</defs></svg>
<div id="root"></div>
<div class="toast" id="toast"></div>
<div class="sheet" id="sheet" onclick="if(event.target===this)this.classList.remove('on')"><div class="box"><div class="handle"></div><div id="sheetNav"></div></div></div>
<script>
const AUTH={%AUTH%}===1, BOT="{%BOT%}";
const NAV=[["dash","📊","Обзор"],["funnel","🎯","Воронка"],["pays","💰","Платежи"],["users","👥","Пользователи"],["bc","📣","Рассылки"],
["refs","🤝","Рефералы"],["promo","🎁","Промокоды"],["settings","⚙️","Настройки"],["admins","👑","Админы"]];
const BNAV=["dash","funnel","pays","users","more"];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>(n==null||n==="")?"—":Number(n).toLocaleString("ru-RU",{maximumFractionDigits:1});
const rub=n=>fmt(Math.round(n||0))+" ₽";
const pct=(a,b)=>b?(Math.round(1000*a/b)/10)+"%":"—";
const MSK=3*3600;
function dt(ts,t=1){if(!ts)return"—";const d=new Date((ts+MSK)*1000);const p=x=>String(x).padStart(2,"0");return `${p(d.getUTCDate())}.${p(d.getUTCMonth()+1)}.${String(d.getUTCFullYear()).slice(2)}`+(t?` ${p(d.getUTCHours())}:${p(d.getUTCMinutes())}`:"")}
function ago(ts){if(!ts)return"—";const s=Date.now()/1000-ts;if(s<0){const d=-s;return d<3600?`через ${Math.round(d/60)} мин`:d<86400?`через ${Math.round(d/3600)} ч`:`через ${Math.round(d/86400)} дн`}
return s<60?"только что":s<3600?`${Math.round(s/60)} мин назад`:s<86400?`${Math.round(s/3600)} ч назад`:`${Math.round(s/86400)} дн назад`}
function toast(m,err){const t=$("#toast");t.textContent=m;t.className="toast on"+(err?" err":"");clearTimeout(t._t);t._t=setTimeout(()=>t.className="toast",3200)}
async function api(path,opt={}){
 const o={credentials:"same-origin",headers:{"X-ZPA":"1"},...opt};
 if(opt.json){o.method=o.method||"POST";o.headers["Content-Type"]="application/json";o.body=JSON.stringify(opt.json)}
 const r=await fetch("api/"+path,o);
 if(r.status===401){location.reload();throw new Error("auth")}
 const d=await r.json().catch(()=>({error:"Некорректный ответ сервера"}));
 if(!r.ok||d.error){throw new Error(d.error||("HTTP "+r.status))}
 return d}
const ST={days:30};
function shell(){
 $("#root").innerHTML=`<div class="app"><aside class="side"><div class="logo"><i>⚡</i><div>IngVertuVpn<small>Админ-панель</small></div></div>
 <nav class="nav">${NAV.map(([k,i,t])=>`<a href="#${k}" data-k="${k}"><span class="ic">${i}</span>${t}</a>`).join("")}</nav>
 <div class="foot"><div id="meName"></div><a href="logout">Выйти</a></div></aside>
 <main id="main"></main></div>
 <nav class="bnav">${BNAV.map(k=>{if(k==="more")return `<a href="javascript:void(0)" onclick="$('#sheet').classList.add('on')" data-k="more"><span class="ic">•••</span>Ещё</a>`;const n=NAV.find(x=>x[0]===k);return `<a href="#${k}" data-k="${k}"><span class="ic">${n[1]}</span>${n[2]}</a>`}).join("")}</nav>`;
 $("#sheetNav").innerHTML=NAV.filter(n=>!BNAV.includes(n[0])).map(([k,i,t])=>`<a href="#${k}" onclick="$('#sheet').classList.remove('on')"><span>${i}</span>${t}</a>`).join("")+`<a href="logout"><span>🚪</span>Выйти</a>`;
 api("me").then(m=>{$("#meName").innerHTML=`Вы: <b>${esc(m.name)}</b>`}).catch(()=>{});
}
function setNav(k){document.querySelectorAll("[data-k]").forEach(a=>{const on=a.dataset.k===k||(a.dataset.k==="more"&&!BNAV.includes(k));a.classList.toggle("on",on)})}
function head(title,extra=""){return `<div class="top"><h1>${title}</h1>${extra}</div>`}
function daysSeg(cb,opts=[[1,"Сегодня"],[7,"7 дн"],[30,"30 дн"],[90,"90 дн"],[0,"Всё"]]){return `<div class="seg">${opts.map(([v,t])=>`<button class="${ST.days==v?"on":""}" onclick="ST.days=${v};${cb}()">${t}</button>`).join("")}</div>`}
function loading(){$("#main").innerHTML=`<div class="empty"><span class="ld"></span></div>`}
function chart(vals,labels,cls="b",unit=""){
 const W=600,H=160,P=18,n=vals.length||1,mx=Math.max(1,...vals),bw=(W-8)/n;
 let s=`<svg class="chart" viewBox="0 0 ${W} ${H+P}" preserveAspectRatio="none">`;
 for(let g=1;g<=3;g++){const y=H-H*g/3;s+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="rgba(140,165,255,.08)"/>`}
 vals.forEach((v,i)=>{const h=Math.max(v?2:0,(H-6)*v/mx);s+=`<rect class="${cls}" x="${4+i*bw+bw*.14}" y="${H-h}" width="${bw*.72}" height="${h}" rx="${Math.min(4,bw*.3)}"><title>${labels[i]}: ${fmt(v)}${unit}</title></rect>`});
 const step=Math.ceil(n/7);labels.forEach((l,i)=>{if(i%step===0||i===n-1&&n<=10)s+=`<text x="${4+i*bw+bw/2}" y="${H+13}" text-anchor="middle">${l}</text>`});
 return s+`</svg>`}
function bindChartTips(){document.querySelectorAll(".chart").forEach(svg=>{const tip=svg.nextElementSibling;svg.querySelectorAll("rect").forEach(r=>{const f=()=>{if(tip)tip.textContent=r.querySelector("title").textContent};r.addEventListener("mouseenter",f);r.addEventListener("click",f)})})}
function kpi(l,v,s="",hl=""){return `<div class="card kpi ${hl}"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`}

/* ---------------- Обзор ---------------- */
async function vDash(){
 loading();const d=await api("dash?days="+(ST.days||365));const k=d.kpi,s=d.series,sys=await api("system").catch(()=>null);
 const per=ST.days==1?"сегодня":ST.days?`за ${ST.days} дн`:"за всё время";
 let h=head("Обзор",daysSeg("vDash",[[7,"7 дн"],[30,"30 дн"],[90,"90 дн"]]));
 h+=`<div class="grid k4">${kpi("Выручка "+per,rub(k.rev_period),`сегодня ${rub(k.rev_today)} · всего ${rub(k.rev_all)}`,"hl")}
 ${kpi("Активные подписки",fmt(k.active),`платных ${fmt(k.active_paid)} · старт ${fmt(k.active_intro)} · пробных ${fmt(k.active_trial)}`)}
 ${kpi("Новые пользователи",fmt(k.new_period),`сегодня +${fmt(k.new_today)} · всего ${fmt(k.users)}`)}
 ${kpi("Конверсия в оплату",(k.conv_period||0)+"%",`первых оплат ${per}: ${fmt(k.first_period)}`)}</div>
 <div class="grid k4 mt">${kpi("MRR (оценка)",rub(k.mrr),"месячная выручка от активных")}
 ${kpi("Оплат "+per,fmt(k.pays_period),`ср. чек ${rub(k.avg_check)} · ARPPU ${rub(k.arppu)}`)}
 ${kpi("Канал",fmt(d.channel_members),`подписаны из бота: ${fmt(k.ch_sub)}`)}
 ${kpi("Автопродление",fmt(k.autopay),`истекают за 3 дня: ${fmt(k.expiring3)}`)}</div>
 <div class="grid k2 mt"><div class="card"><h3>💰 Выручка по дням</h3>${chart(s.rev,s.labels,"b"," ₽")}<div class="tip"></div></div>
 <div class="card"><h3>👥 Новые пользователи</h3>${chart(s.new,s.labels,"b2")}<div class="tip"></div></div>
 <div class="card"><h3>🧾 Первые оплаты</h3>${chart(s.first,s.labels,"b")}<div class="tip"></div></div>
 <div class="card"><h3>📢 Подписки на канал из бота</h3>${chart(s.sub,s.labels,"b2")}<div class="tip"></div></div></div>
 <div class="grid k2 mt"><div class="card"><h3>Последние платежи<span class="sp"></span><a href="#pays" class="sm">все →</a></h3><div class="tw"><table>
 ${d.recent_pay.map(p=>`<tr class="cl" onclick="go('user/${p.tg_id}')"><td><b>${esc(p.name||p.tg_id)}</b><div class="mut sm">${esc(p.plan)} · ${esc(p.provider)}</div></td><td class="num"><b>${rub(p.amount)}</b><div class="mut sm">${ago(p.ts)}</div></td></tr>`).join("")||`<tr><td class="empty">Пока нет</td></tr>`}</table></div></div>
 <div class="card"><h3>Новые пользователи<span class="sp"></span><a href="#users" class="sm">все →</a></h3><div class="tw"><table>
 ${d.recent_users.map(u=>`<tr class="cl" onclick="go('user/${u.tg_id}')"><td><b>${esc(u.name||u.tg_id)}</b><div class="mut sm">${u.tg_id}${u.src?` · ${esc(u.src)}`:""}</div></td><td class="num">${u.ch?'<span class="pill ok">канал ✓</span>':'<span class="pill">без канала</span>'}<div class="mut sm">${ago(u.ts)}</div></td></tr>`).join("")}</table></div></div></div>`;
 if(sys){h+=`<div class="card mt"><h3>🖥 Система</h3><div class="row">${Object.entries(sys.nodes||{}).map(([n,ok])=>`<span class="pill ${ok?"ok":"bad"}">${ok?"●":"○"} ${esc(n)}</span>`).join("")}

/* ---------------- Рассылки ---------------- */
let BCIMG=null,BCPATH=null;
async function vBc(){
 loading();const d=await api("bc");const sg=d.segments;
 let h=head("Рассылки");
 h+=`<div class="grid k2"><div class="card"><h3>✍️ Новая рассылка</h3>
 <label class="f">Кому</label><select id="bseg">${Object.entries(sg).map(([k,v])=>`<option value="${k}">${esc(v.title)} — ${fmt(v.count)}</option>`).join("")}<option value="ids">Список Telegram ID…</option></select>
 <div id="bidsW" style="display:none"><label class="f">Telegram ID (через запятую/пробел/с новой строки)</label><textarea id="bids" style="min-height:80px"></textarea></div>
 <label class="f">Текст (HTML: &lt;b&gt;, &lt;i&gt;, &lt;a href&gt;, &lt;code&gt;, &lt;blockquote&gt;)</label><textarea id="btext" placeholder="Привет! 🔥 ..."></textarea>
 <div class="row sm mut" style="justify-content:space-between"><span id="blen">0 символов</span><span><a href="javascript:void(0)" onclick="wrap('b')">Ж</a> · <a href="javascript:void(0)" onclick="wrap('i')"><i>К</i></a> · <a href="javascript:void(0)" onclick="wrapLink()">ссылка</a></span></div>
 <label class="f">Картинка (необязательно)</label><input type="file" id="bimg" accept="image/*">
 <div class="grid k2"><div><label class="f">Кнопка: текст</label><input type="text" id="bbt" placeholder="🚀 Открыть бота"></div><div><label class="f">Кнопка: ссылка</label><input type="text" id="bbu" placeholder="https://t.me/${BOT}"></div></div>
 <div class="row mt"><button class="btn s" id="btest">🧪 Тест себе</button><button class="btn p" id="bgo">📣 Запустить рассылку</button></div>
 <div class="note">Перед запуском сообщение придёт вам для проверки. Скорость ~20 сообщений/сек, рассылка продолжится даже после перезапуска бота. Заблокировавшие бота исключаются автоматически.</div></div>
 <div class="card"><h3>👁 Предпросмотр</h3><div class="preview" id="bprev"><span class="mut">Начните писать текст…</span></div></div></div>
 <div class="card mt"><h3>История<span class="sp"></span><button class="btn s" onclick="vBc()">🔄 Обновить</button></h3><div class="tw"><table><tr><th>#</th><th>Когда</th><th>Кому</th><th>Текст</th><th>Прогресс</th><th></th></tr>
 ${d.rows.map(b=>{const p=b.total?Math.round(100*b.pos/b.total):100;return `<tr><td>${b.id}</td><td class="sm">${dt(b.ts)}</td><td class="sm">${esc(b.seg)}</td><td class="sm" style="max-width:280px">${esc(b.text.replace(/<[^>]+>/g,"")).slice(0,90)}${b.photo?" 🖼":""}</td>
 <td style="min-width:150px"><div class="prog"><i style="width:${p}%"></i></div><div class="sm mut">${fmt(b.sent)} доставлено · ${fmt(b.failed)} ошибок · ${b.status==="running"?`<b class="up">идёт ${p}%</b>`:b.status==="done"?"готово":b.status==="cancelled"?"остановлена":esc(b.status)}</div></td>
 <td>${b.status==="running"?`<button class="btn d s" onclick="bcCancel(${b.id})">Стоп</button>`:""}</td></tr>`}).join("")||`<tr><td colspan=6 class="empty">Рассылок ещё не было</td></tr>`}</table></div></div>`;
 $("#main").innerHTML=h;
 const upd=()=>{const t=$("#btext").value;$("#blen").textContent=t.length+" символов"+(BCIMG&&t.length>1024?" — слишком длинно для подписи к картинке (макс. 1024)":"");
  $("#bprev").innerHTML=(BCIMG?`<img src="${BCIMG}">`:"")+(t?sanit(t):'<span class="mut">Начните писать текст…</span>')+($("#bbt").value?`<div class="pb">${esc($("#bbt").value)}</div>`:"")};
 ["btext","bbt"].forEach(i=>$("#"+i).oninput=upd);
 $("#bseg").onchange=e=>{$("#bidsW").style.display=e.target.value==="ids"?"":"none"};
 $("#bimg").onchange=e=>{const f=e.target.files[0];BCPATH=null;if(!f){BCIMG=null;upd();return}const r=new FileReader();r.onload=()=>{BCIMG=r.result;upd()};r.readAsDataURL(f)};
 $("#btest").onclick=()=>bcSend(1);$("#bgo").onclick=()=>bcSend(0);
 clearTimeout(ST.bcT);if(d.rows.some(b=>b.status==="running"))ST.bcT=setTimeout(()=>{if(location.hash==="#bc")vBc()},5000)}
function sanit(t){const ok=/^<\/?(b|strong|i|em|u|ins|s|strike|del|code|pre|blockquote|tg-spoiler|a(\s+href="[^"]*")?)>$/i;return t.replace(/<[^>]*>|[^<]+/g,m=>m[0]==="<"?(ok.test(m)?m:esc(m)):m.replace(/&(?!(amp|lt|gt|quot|#\d+);)/g,"&amp;"))}
function wrap(tag){const a=$("#btext"),s=a.selectionStart,e=a.selectionEnd;a.value=a.value.slice(0,s)+`<${tag}>`+a.value.slice(s,e)+`</${tag}>`+a.value.slice(e);a.dispatchEvent(new Event("input"))}
function wrapLink(){const u=prompt("Ссылка (https://…)");if(!u)return;const a=$("#btext"),s=a.selectionStart,e=a.selectionEnd;a.value=a.value.slice(0,s)+`<a href="${u}">`+(a.value.slice(s,e)||"ссылка")+`</a>`+a.value.slice(e);a.dispatchEvent(new Event("input"))}
async function bcSend(test){
 const seg=$("#bseg").value,opt=$("#bseg").selectedOptions[0].textContent;
 if(!test&&!confirm(`Запустить рассылку?\n\nКому: ${opt}\n\nСначала копия придёт вам.`))return;
 const fd=new FormData();fd.append("text",$("#btext").value);fd.append("segment",seg);fd.append("btn_text",$("#bbt").value);fd.append("btn_url",$("#bbu").value);fd.append("ids",$("#bids").value);fd.append("test",test?"1":"0");
 if(BCPATH)fd.append("photo_path",BCPATH);else if($("#bimg").files[0])fd.append("photo",$("#bimg").files[0]);
 const btn=test?$("#btest"):$("#bgo");btn.disabled=true;
 try{const r=await api("bc",{method:"POST",body:fd});if(r.photo_path)BCPATH=r.photo_path;toast(test?"✅ Тестовое сообщение отправлено вам в Telegram":`✅ Рассылка #${r.id} запущена: ${fmt(r.total)} получателей`);if(!test)vBc()}
 catch(e){toast(e.message,1)}finally{btn.disabled=false}}
async function bcCancel(id){if(!confirm("Остановить рассылку?"))return;await api("bc_cancel/"+id,{json:{}});toast("Останавливаю…");setTimeout(vBc,1500)}

 $("#main").innerHTML=h}

async function vSettings(){
 loading();const d=await api("settings");
 let h=head("Настройки");
 h+=d.groups.map((g,gi)=>`<div class="card ${gi?"mt":""}"><h3>${g.g}${g.g.includes("ЮKassa")?`<span class="sp"></span><button class="btn s" onclick="ykTest()">Проверить подключение</button>`:""}</h3>
 ${g.items.map(it=>`<div class="set"><div class="t">${esc(it.t)}</div><div class="c" style="${it.type==="bool"?"width:auto":""}">${field(it)}</div></div>`).join("")}${g.note?`<div class="note">${esc(g.note)}</div>`:""}</div>`).join("");
 h+=`<div class="row mt" style="position:sticky;bottom:calc(76px + var(--sb));justify-content:flex-end"><button class="btn p" onclick="saveSettings()">💾 Сохранить изменения</button></div>`;
 $("#main").innerHTML=h;ST.sorig=collect()}
function field(it){const id="s_"+it.k;
 if(it.type==="bool")return `<label class="sw"><input type="checkbox" id="${id}" data-k="${it.k}" ${it.v?"checked":""}><span></span></label>`;
 if(it.type==="select")return `<select id="${id}" data-k="${it.k}">${it.opts.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(it.v)?"selected":""}>${esc(o[1])}</option>`).join("")}</select>`;
 if(it.type==="secret")return `<input type="password" id="${id}" data-k="${it.k}" placeholder="${it.v?esc(it.v)+" (сохранён)":"не задан"}" autocomplete="new-password">`;
 return `<input type="${it.type==="int"?"number":"text"}" id="${id}" data-k="${it.k}" value="${esc(it.v)}">`}
function collect(){const o={};document.querySelectorAll("[data-k]").forEach(el=>{if(!el.id||!el.id.startsWith("s_"))return;o[el.dataset.k]=el.type==="checkbox"?el.checked:el.value});return o}
async function saveSettings(){const cur=collect(),ch={};for(const k in cur){if(String(cur[k])!==String(ST.sorig[k])&&!(k==="yk_secret"&&!cur[k]))ch[k]=cur[k]}
 if(!Object.keys(ch).length){toast("Нет изменений");return}
 try{const r=await api("settings",{json:ch});toast("✅ Сохранено: "+r.changed.length);vSettings()}catch(e){toast(e.message,1)}}
